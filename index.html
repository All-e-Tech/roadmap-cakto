<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap Cakto</title>

<!-- Fontes: as mesmas que o protótipo carrega hoje (Inter + JetBrains Mono).
     Public Sans entra no passo 5 (divergences C4). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<!-- Única dependência não-ESM: SheetJS, só para importar planilha (SPEC §8). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

<!-- Camada de renderização via CDN, sem build (SPEC §2). O import map faz
     "preact", "preact/hooks" e "htm" resolverem para uma única instância. -->
<script type="importmap">
{
  "imports": {
    "preact":       "https://cdn.jsdelivr.net/npm/preact@10.24.3/dist/preact.module.js",
    "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.24.3/hooks/dist/hooks.module.js",
    "htm":          "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
